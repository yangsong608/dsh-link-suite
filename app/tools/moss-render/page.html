<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
import * as THREE from '/assets3d/three.module.min.js'
import { FBXLoader } from '/assets3d/FBXLoader.js'

const KEY = { Moss_Main: 'Main', Moss_arm: 'arm', Moss_Glass: 'Glass', Moss_Annexes: 'Annexes' }
const HAVE = new Set([
  'Main_base','Main_normal','Main_emissive','Main_orm',
  'arm_base','arm_normal','arm_orm',
  'Glass_base','Glass_orm',
  'Annexes_base','Annexes_normal','Annexes_emissive','Annexes_orm',
])

const canvas = document.getElementById('stage')
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true })
renderer.setClearColor(0x000000, 0)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.75

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 4000)

// 环境反射：金属件没有环境贴图会发平
try {
  const pmrem = new THREE.PMREMGenerator(renderer)
  const room = new THREE.Scene()
  room.add(new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    // 环境球要亮：金属件的可见度几乎全靠环境反射，深灰色球会把机身压成黑的
    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide }),
  ))
  const lamp = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ color: 0xffffff }))
  lamp.position.set(0, 2, 0); lamp.rotation.x = -Math.PI / 2
  room.add(lamp)
  scene.environment = pmrem.fromScene(room, 0.04).texture
} catch (e) { /* 环境贴图失败不影响主渲染 */ }

scene.add(new THREE.HemisphereLight(0xffffff, 0x24303d, 1.7))
const key = new THREE.DirectionalLight(0xffffff, 2.5); key.position.set(50, 80, 90); scene.add(key)
const fill = new THREE.DirectionalLight(0x9dc6ff, 1.2); fill.position.set(-70, 24, -30); scene.add(fill)
const rim = new THREE.DirectionalLight(0xffd9a0, 0.9); rim.position.set(-20, -50, 40); scene.add(rim)
// 正面补光：启动页底色是近黑，没有这盏灯机身会整体沉进背景
const front = new THREE.DirectionalLight(0xffffff, 1.9); front.position.set(0, 10, 120); scene.add(front)
// 底部反弹光：让机身下缘不至于完全黑掉，给出"立着"的体积感
const bounce = new THREE.DirectionalLight(0x8fd8ff, 0.7); bounce.position.set(10, -80, 60); scene.add(bounce)

/**
 * 贴图加载追踪。
 *
 * 真实踩过的坑：TextureLoader 是异步的，FBXLoader 的 onLoad 回调返回时
 * 不代表贴图已经就绪。第一次渲染（boot）于是拿到空贴图，机身发黑；
 * 第二次渲染（badge）就正常了。
 *
 * 表现是"同一套光照与角度，第一张黑、第二张正常"——很容易误判成角度问题，
 * 去反复改 yaw/pitch。正确做法是等贴图全部 onLoad 再渲染。
 *
 * 实现刻意简单：一个计数器 + 轮询等待。贴图数量固定（13 个 webp），
 * 加载很快，轮询比精巧的 Promise 编排更不容易写错。
 */
let pendingTextures = 0

function trackTexture(tex) {
  pendingTextures += 1
  const done = () => { pendingTextures -= 1 }
  tex.addEventListener('load', done)
  tex.addEventListener('error', done)
  return tex
}

/** 等贴图全部就绪；超时 8s 后放弃（宁可渲一张暗图，也不要卡死）。 */
async function waitTextures() {
  const deadline = Date.now() + 8000
  while (pendingTextures > 0 && Date.now() < deadline) {
    await new Promise((r) => setTimeout(r, 50))
  }
}

const loader = new THREE.TextureLoader()
const texS = (n) => { const t = trackTexture(loader.load('/assets3d/tex/' + n + '.webp')); t.colorSpace = THREE.SRGBColorSpace; return t }
const texL = (n) => trackTexture(loader.load('/assets3d/tex/' + n + '.webp'))

let obj = null
let eyeCore = null
let eyeHalo = null
let eyeLamp = null

/**
 * 建眼灯。
 *
 * 关键：几何只建一次（位置、半径、光晕贴图都是静态的），
 * "是否工作"只影响不透明度与光强，由 __render 每次调用时改。
 * 之前把 working 传进来固化，导致先渲染 idle 再渲染 work 时，
 * 眼灯还停留在 idle 的亮度上——两张图看起来一样。
 */
function makeEye(mainMesh) {
  const mb = new THREE.Box3().setFromObject(mainMesh)
  const ms = mb.getSize(new THREE.Vector3())
  const mc = mb.getCenter(new THREE.Vector3())
  const lensPos = new THREE.Vector3(
    mc.x + ms.x * 0.105,
    mc.y + ms.y * 0.142,
    mb.max.z + ms.z * 0.02,
  )
  // 原比例 0.105 在 160px 输出里只有三四个像素，肉眼几乎看不到。
  // 这不是"模型不对"，而是角标尺寸下需要放大才可读——指示灯的语义
  // 是"一眼看到它在工作"，不是"忠实还原镜头尺寸"。
  const radius = Math.min(ms.x, ms.y) * 0.19
  const host = mainMesh.parent || obj
  host.updateMatrixWorld(true)

  const core = new THREE.Mesh(
    new THREE.CircleGeometry(radius, 32),
    new THREE.MeshBasicMaterial({
      color: 0xff3a12, transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }),
  )
  core.position.copy(host.worldToLocal(lensPos.clone()))
  core.renderOrder = 5
  host.add(core)

  const cvs = document.createElement('canvas')
  cvs.width = cvs.height = 128
  const ctx = cvs.getContext('2d')
  // 光晕的颜色必须**压低绿蓝通道**：additive 混合下，只要绿蓝不为 0
  // 就会在叠加中把红冲成白（实测 work 态整片 240,240,240）。
  // 这里用接近纯红的渐变，只保留一点点橙做暖感。
  const g = ctx.createRadialGradient(64, 64, 2, 64, 64, 64)
  g.addColorStop(0, 'rgba(255,60,20,0.92)')
  g.addColorStop(0.3, 'rgba(230,30,10,0.42)')
  g.addColorStop(1, 'rgba(180,10,0,0)')
  ctx.fillStyle = g
  ctx.fillRect(0, 0, 128, 128)

  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cvs), transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false,
    opacity: 0.35,
  }))
  halo.position.copy(host.worldToLocal(lensPos.clone())).add(new THREE.Vector3(0, 0, ms.z * 0.01))
  halo.userData.base = radius
  halo.scale.setScalar(radius * 7)
  halo.renderOrder = 6
  host.add(halo)

  const lamp = new THREE.PointLight(0xff3a14, 0.8, ms.y * 0.9, 2)
  lamp.position.copy(host.worldToLocal(lensPos.clone())).add(new THREE.Vector3(0, 0, ms.z * 0.35))
  host.add(lamp)

  eyeCore = core; eyeHalo = halo; eyeLamp = lamp
}

/** 取景：只框住主体（不含机械臂），按给定角度摆放相机。 */
function frame(yawDeg, pitchDeg) {
  const main = obj.getObjectByName('Moss_Main')
  const target = main ?? obj
  const box = new THREE.Box3().setFromObject(target)
  const center = box.getCenter(new THREE.Vector3())
  const size = box.getSize(new THREE.Vector3())
  const radius = Math.max(size.x, size.y, size.z) * 0.5
  const fovRad = (camera.fov * Math.PI) / 180
  // 1.22 是留边系数：贴边会显得"塞满"，留一点呼吸
  const dist = radius / Math.sin(fovRad / 2) * 1.22

  const yaw = (yawDeg * Math.PI) / 180
  const pitch = (pitchDeg * Math.PI) / 180
  camera.position.set(
    center.x + dist * Math.cos(pitch) * Math.sin(yaw),
    center.y + dist * Math.sin(pitch),
    center.z + dist * Math.cos(pitch) * Math.cos(yaw),
  )
  camera.lookAt(center)
  camera.updateProjectionMatrix()
}

window.__render = async (opts) => {
  const { width = 512, height = 512, yaw = 0, pitch = 0, working = false } = opts || {}
  if (obj === null) {
    obj = await new Promise((resolve, reject) => {
      new FBXLoader().load('/assets3d/moss.fbx', resolve, undefined, reject)
    })

    obj.traverse((n) => {
      if (!n.isMesh) return
      const k = KEY[n.material.name] || 'Main'
      const orm = HAVE.has(k + '_orm') ? texL(k + '_orm') : null
      const mat = new THREE.MeshStandardMaterial({
        map: HAVE.has(k + '_base') ? texS(k + '_base') : null,
        metalnessMap: orm, roughnessMap: orm, aoMap: orm,
        // metalness 降到 0.18：金属度越高越依赖环境反射，深色背景下越黑
        metalness: 0.18, roughness: 0.52,
        // 自发光只用来"托底"：MOSS 的贴图偏暗，纯黑在深色启动页上等于消失。
        // 但强度必须低——之前 1.6 配 2.2 曝光把暗部推到纯白，
        // 结果红眼灯（唯一的彩色元素）被冲掉了，反而看不出在发光。
        emissive: new THREE.Color(0x16241f),
        emissiveIntensity: 0.55,
        transparent: k === 'Glass', opacity: k === 'Glass' ? 0.58 : 1,
      })
      if (HAVE.has(k + '_normal')) mat.normalMap = texL(k + '_normal')
      if (HAVE.has(k + '_emissive')) {
        mat.emissive = new THREE.Color(0xffffff)
        mat.emissiveIntensity = 0.6
        mat.emissiveMap = texL(k + '_emissive')
      }
      n.material = mat
    })

    // ── 只保留主体：机械臂是独立网格，直接隐藏 ──
    // Moss_Main / Moss_Annexes / Moss_Glass 三块拼成机身，Moss_arm 是那条机械臂。
    const arm = obj.getObjectByName('Moss_arm')
    if (arm) arm.visible = false

    // 把主体移到原点，便于取景
    const main = obj.getObjectByName('Moss_Main')
    const box = new THREE.Box3().setFromObject(main ?? obj)
    const center = box.getCenter(new THREE.Vector3())
    obj.position.sub(center)

    scene.add(obj)
    obj.updateMatrixWorld(true)
    if (main) makeEye(main)
  }

  // 状态切换：只改眼灯亮度，几何不变
  // work 态不只"更亮"，还要"更大"：纯提亮度在 additive blending 下
  // 会先过曝成白点，反而看不出是红的。
  // 核心不透明度不能顶到 1：additive 下满不透明会直接烧成白点。
  if (eyeCore) eyeCore.material.opacity = working ? 0.82 : 0.4
  if (eyeHalo) {
    // 光晕：idle 小而暗（像待机的呼吸灯），work 大而亮（明确在工作）
    eyeHalo.material.opacity = working ? 0.78 : 0.34
    const radius = eyeHalo.userData.base || 1
    eyeHalo.scale.setScalar(radius * (working ? 9 : 6))
  }
  if (eyeLamp) eyeLamp.intensity = working ? 4.5 : 0.6

  // 等贴图就绪：否则第一张图会拿到空材质（见 trackTexture 的注释）
  await waitTextures()

  renderer.setPixelRatio(1)
  renderer.setSize(width, height, false)
  camera.aspect = width / height
  frame(yaw, pitch)
  __renderCalls += 1
  renderer.render(scene, camera)
  // WebP 带 alpha 且体积约为 PNG 的 1/4；Chrome 支持 canvas 直接编码。
  // 回退到 PNG 只在浏览器不支持时发生（本项目固定用 Chrome 渲染）。
  const format = opts?.format === 'png' ? 'image/png' : 'image/webp'
  const quality = typeof opts?.quality === 'number' ? opts.quality : 0.92
  return canvas.toDataURL(format, quality)
}

// 探针：读模型尺寸与眼灯世界坐标，用于核对"眼灯是不是真的长在镜头位置"。
// 不参与产出，只供 render.mjs 的 --probe 模式诊断。
window.__probe = () => {
  const main = obj.getObjectByName('Moss_Main')
  const box = new THREE.Box3().setFromObject(main ?? obj)
  const size = box.getSize(new THREE.Vector3())
  const center = box.getCenter(new THREE.Vector3())
  const all = new THREE.Box3().setFromObject(obj)
  const allSize = all.getSize(new THREE.Vector3())
  const eyeWorld = new THREE.Vector3()
  if (eyeCore) eyeCore.getWorldPosition(eyeWorld)
  return {
    main: { min: box.min.toArray(), max: box.max.toArray(), size: size.toArray(), center: center.toArray() },
    whole: { min: all.min.toArray(), max: all.max.toArray(), size: allSize.toArray() },
    eyeWorld: eyeWorld.toArray(),
    parts: ['Moss_Main','Moss_Annexes','Moss_Glass','Moss_arm'].map((n) => {
      const m = obj.getObjectByName(n)
      return { name: n, exists: !!m, visible: m ? m.visible : null }
    }),
  }
}

// 调试用：读相机位置，确认 yaw/pitch 真的生效
window.__camPos = () => ({ pos: camera.position.toArray(), quat: camera.quaternion.toArray() })
let __renderCalls = 0
window.__renderCalls = () => __renderCalls
window.__scene = () => {
  const out = []
  scene.traverse((n) => {
    if (n.type === 'Scene' || n.type === 'Group') return
    const box = new THREE.Box3().setFromObject(n)
    const size = box.getSize(new THREE.Vector3())
    const center = box.getCenter(new THREE.Vector3())
    out.push({
      type: n.type, name: n.name || '(unnamed)', visible: n.visible,
      size: size.toArray().map((v) => Math.round(v * 10) / 10),
      center: center.toArray().map((v) => Math.round(v * 10) / 10),
    })
  })
  return out
}

window.__ready = true
</script>
</body>
</html>
